name: iOS Compatibility Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master, ci/ios-26-compatibility]

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iOS 26 build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            pod --version
            swiftformat --version
          } | tee ci-output/tool-versions.log

      - name: Resolve CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Podfile retains the modified TimeDelta/WSTagsField commit.
          # Keep the reviewed dependency graph fixed on CI.
          pod install --deployment 2>&1 | tee ci-output/pod-install.log
          cp Podfile.lock ci-output/Podfile.lock

      - name: Generate build version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/create-git-version-swift-file.sh
          test -s Common/Common/GitVersion.swift

      - name: Test persistence and Health exchange
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/prepare-mood-health-tests.rb
          xcrun simctl list devices available --json > ci-output/simulators.json
          simulator_id=$(python3 -c 'import json; d=json.load(open("ci-output/simulators.json")); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["isAvailable"] and "iPhone" in v["name"]))')
          xcrun simctl bootstatus "$simulator_id" -b > ci-output/simulator-boot.log 2>&1 &
          simulator_boot_pid=$!
          xcodebuild test \
            -workspace Introspective.xcworkspace \
            -scheme MoodHealthTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:MoodHealthTests/MoodHealthExchangeFunctionalTests \
            -only-testing:MoodHealthTests/SavedQueryTests \
            -derivedDataPath "$RUNNER_TEMP/MoodTestsDerivedData" \
            -resultBundlePath "$GITHUB_WORKSPACE/ci-output/MoodTests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY='-' \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee ci-output/mood-tests.log
          wait "$simulator_boot_pid"
          xcrun xcresulttool get test-results summary --path ci-output/MoodTests.xcresult > ci-output/mood-tests-summary.json
          python3 -c 'import json; r=json.load(open("ci-output/mood-tests-summary.json")); assert r["passedTests"] >= 18 and r["failedTests"] == 0, r'

      - name: Build without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace Introspective.xcworkspace \
            -scheme CI-CD \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/IntrospectiveDerivedData" \
            -resultBundlePath "$GITHUB_WORKSPACE/ci-output/Build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee ci-output/xcodebuild.log

      - name: Record generated changes
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          git status --short > ci-output/working-tree-status.txt
          git diff --stat > ci-output/generated-changes.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-26-build-diagnostics
          path: ci-output/
          retention-days: 14
          if-no-files-found: warn
